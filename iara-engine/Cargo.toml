[package]
name = "iara-engine"
version = "0.1.0"
edition = "2021"
description = "Motor de Ressonância IARA — Liquid Neural Network Physics Engine"

[features]
# Features padrão: lógica de simulação ativada por padrão
default  = ["stdp", "circadian", "actuator"]
stdp     = []
circadian = []
actuator  = []

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Memory-mapped I/O
memmap2 = "0.9"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

# Parallelism
rayon = "1.10"

# GPU nativa — HIP FFI direto (sem candle, sem rocm-rs e seu kernel sorting quebrado)
hip-ffi = { path = "../hip-ffi" }

# Operações matriciais CPU (fallback e pré-processamento)
ndarray = { version = "0.16", features = ["rayon"] }

# Float conversion (BF16 → F32)
half = { version = "2", features = ["serde"] }

# Logging
env_logger = "0.11"
log = "0.4"

# Error handling
anyhow = "1"
thiserror = "1"

# HTTP framework (API handlers)
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Data/tempo
chrono = { version = "0.4", features = ["serde"] }

# HuggingFace Tokenizer (BPE)
tokenizers = "0.21"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
