[package]
name = "iara-engine"
version = "0.1.0"
edition = "2021"
description = "Motor de Ressonância IARA — Liquid Neural Network Physics Engine"

[features]
default      = []
experimental = []   # Compila módulos exploratórios (physics, liquid_network, etc.)
stdp         = []   # Gates STDP learning in liquid_network
circadian    = []   # Gates circadian rhythm in liquid_network/homeostasis
rocm         = ["dep:hip-ffi", "dep:rocm-backend"]
opencl       = ["dep:opencl-backend"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Memory-mapped I/O
memmap2 = "0.9"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

# Parallelism
rayon = "1.10"

# Abstração de compute — trait ComputeBackend (ROCm, OpenCL, CPU)
compute-core = { path = "../compute-core" }

# Telemetry: neuron observation, tensor snapshots, flow events
iara-observe = { path = "../iara-observe" }

# LoRA training engine (CPU f32, AdamW, safetensors)
iara-train = { path = "../iara-train" }

# GPU nativa — HIP FFI direto (sem candle, sem rocm-rs e seu kernel sorting quebrado)
# Mantido como opcional: usado pelo rocm-backend via feature "rocm"
hip-ffi = { path = "../hip-ffi", optional = true }

# Backends opcionais — compilar apenas quando necessário
rocm-backend   = { path = "../rocm-backend", optional = true }
opencl-backend = { path = "../opencl-backend", optional = true }

# llama.cpp FFI — motor de inferência de alta performance
llama-sys = { path = "../llama-sys" }

# Operações matriciais CPU (fallback e pré-processamento)
ndarray = { version = "0.16", features = ["rayon"] }

# Float conversion (BF16 → F32)
half = { version = "2", features = ["serde"] }

# Logging
env_logger = "0.11"
log = "0.4"

# Error handling
anyhow = "1"
thiserror = "1"

# HTTP framework (API handlers)
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }
sysinfo = "0.30" # Adiciona para monitoramento de sistema

# Data/tempo
chrono = { version = "0.4", features = ["serde"] }

# UUID generation for run IDs (ACP protocol)
uuid = { version = "1", features = ["v4", "serde"] }

# HuggingFace Tokenizer (BPE)
tokenizers = "0.21"

# Geração aleatória (multinomial sampling)
rand = "0.8"

# HTTP client (used by stress_test binary + integration tests)
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Temp files for DNA roundtrip tests
tempfile = "3"

[[bin]]
name = "stress_test"
path = "src/bin/stress_test.rs"

[[bench]]
name = "baseline"
harness = false

[[bench]]
name = "improved"
harness = false
