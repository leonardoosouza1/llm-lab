services:
  iara-engine:
    build:
      context: .
      dockerfile: Dockerfile.rocm
    image: iara-engine-rocm
    container_name: iara-engine
    # Privilégios de hardware conforme documentação oficial AMD ROCm
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    # Otimização de performance: memória compartilhada para tensores pesados
    ipc: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    # Variáveis de ambiente para sua AMD RX 6750 XT
    environment:
      - HSA_OVERRIDE_GFX_VERSION=10.3.0
      - ROCM_PATH=/opt/rocm
      - RUST_LOG=info
    # Mapeia a pasta de modelos atual para dentro do container
    volumes:
      - .:/models
    ports:
      - "8080:8080"
    # Mantém o terminal interativo para você ver o "Cérebro" carregando
    stdin_open: true
    tty: true
    restart: unless-stopped
