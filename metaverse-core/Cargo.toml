[package]
name = "metaverse-core"
version = "0.1.0"
edition = "2021"
description = "MetaVerse: Mundo Metafísico para Organismos Digitais com Inteligência Emergente"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.10"
rayon = "1.8"
safetensors = "0.7"
memmap2 = "0.9"
half = "2.3"

[dev-dependencies]
approx = "0.5"

[[bin]]
name = "metaverse-core"
path = "src/main.rs"

[[bin]]
name = "export"
path = "src/bin/export.rs"

[[bin]]
name = "solve"
path = "src/bin/solve.rs"

[[bin]]
name = "bench_real"
path = "src/bin/bench_real.rs"
