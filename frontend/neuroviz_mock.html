<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IARA — Neural Visualizer (MOCK)</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0f; color: #e0e0ff; font-family: 'JetBrains Mono', monospace;
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }

    #topbar {
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
      background: #111128; border-bottom: 1px solid #222244;
      flex-shrink: 0;
    }
    #topbar h1 { font-size: 13px; color: #8888ff; letter-spacing: 2px; }
    #mock-badge {
      background: #2a1a00; border: 1px solid #664400; color: #aa6600;
      font-size: 10px; padding: 2px 8px; border-radius: 10px; letter-spacing: 1px;
    }
    #prompt-input {
      flex: 1; background: #0d0d1f; border: 1px solid #333366; color: #cce;
      padding: 6px 12px; border-radius: 4px; font-size: 13px; font-family: inherit;
    }
    #run-btn {
      background: #3333aa; color: #aaaaff; border: none; padding: 7px 18px;
      border-radius: 4px; cursor: pointer; font-size: 13px;
      transition: background 0.2s;
    }
    #run-btn:hover { background: #4444cc; }
    #status { font-size: 11px; color: #666688; min-width: 140px; }

    #main { display: flex; flex: 1; overflow: hidden; }

    #token-list {
      width: 140px; flex-shrink: 0; background: #0d0d1a;
      border-right: 1px solid #1a1a33; overflow-y: auto; padding: 8px 4px;
    }
    .token-item {
      padding: 6px 10px; margin: 2px; border-radius: 4px; cursor: pointer;
      font-size: 12px; transition: all 0.15s; border: 1px solid transparent;
      color: #9999cc;
    }
    .token-item:hover { background: #1a1a33; border-color: #333366; }
    .token-item.active { background: #1a1a44; border-color: #4444aa; color: #aaaaff; }
    .token-pos { font-size: 9px; color: #444466; }

    #canvas-wrapper { flex: 1; position: relative; }
    #three-canvas { width: 100%; height: 100%; display: block; }

    #layer-labels {
      position: absolute; left: 8px; top: 0; bottom: 0;
      pointer-events: none; display: flex; flex-direction: column-reverse;
      justify-content: space-around; padding: 20px 0;
    }
    .layer-label { font-size: 9px; color: #444466; }

    #attn-panel {
      width: 180px; flex-shrink: 0; background: #0d0d1a;
      border-left: 1px solid #1a1a33; padding: 10px; overflow-y: auto;
    }
    #attn-panel h3 { font-size: 11px; color: #6666aa; margin-bottom: 8px; letter-spacing: 1px; }
    #attn-svg { width: 100%; }

    #bottom-bar {
      background: #0d0d1a; border-top: 1px solid #1a1a33;
      padding: 10px 16px; flex-shrink: 0; min-height: 80px; max-height: 140px; overflow-y: auto;
    }
    #bottom-bar h3 { font-size: 10px; color: #555577; letter-spacing: 1px; margin-bottom: 6px; }
    #neuron-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .neuron-chip {
      background: #1a1a33; border: 1px solid #2a2a55; padding: 2px 8px;
      border-radius: 12px; font-size: 11px; color: #8888cc;
    }
    .neuron-chip .val { color: #6666ff; margin-left: 4px; }
    #logit-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .logit-chip {
      background: #1a2a1a; border: 1px solid #2a3a2a; padding: 2px 8px;
      border-radius: 12px; font-size: 11px; color: #88cc88;
    }
    .logit-chip .pct { color: #44cc44; margin-left: 4px; font-weight: bold; }

    #tooltip {
      position: fixed; background: #111128; border: 1px solid #333366;
      padding: 8px 12px; border-radius: 6px; font-size: 11px; color: #cce;
      pointer-events: none; z-index: 200; display: none;
      max-width: 220px; line-height: 1.5;
    }
  </style>
</head>
<body>

<div id="topbar">
  <h1>IARA NEURAL VIZ</h1>
  <span id="mock-badge">MOCK DATA</span>
  <input id="prompt-input" type="text" value="The Eiffel Tower was built in" placeholder="Enter prompt…">
  <button id="run-btn">&#9654; Generate Mock</button>
  <span id="status">ready — no backend needed</span>
</div>

<div id="main">
  <div id="token-list">
    <div style="font-size:9px;color:#333355;padding:4px 8px;letter-spacing:1px;">TOKENS</div>
  </div>

  <div id="canvas-wrapper">
    <canvas id="three-canvas"></canvas>
    <div id="layer-labels"></div>
  </div>

  <div id="attn-panel">
    <h3>ATTENTION</h3>
    <svg id="attn-svg" height="300"></svg>
    <div id="attn-info" style="font-size:10px;color:#555577;margin-top:8px;"></div>
  </div>
</div>

<div id="bottom-bar">
  <div id="top-neurons-section">
    <h3>TOP NEURONS — <span id="layer-info">select a layer</span></h3>
    <div id="neuron-chips"></div>
  </div>
  <h3 style="margin-top:8px;">NEXT TOKEN PREDICTIONS</h3>
  <div id="logit-chips"></div>
</div>

<div id="tooltip"></div>

<script>
// ============================================================
// SEEDED PRNG — deterministic fake data per prompt
// ============================================================
function makePRNG(seed) {
  let s = seed >>> 0;
  return {
    next() {
      s ^= s << 13; s ^= s >> 17; s ^= s << 5;
      return ((s >>> 0) / 0xFFFFFFFF);
    },
    int(lo, hi) { return Math.floor(lo + this.next() * (hi - lo)); },
    float(lo, hi) { return lo + this.next() * (hi - lo); },
    gauss() {
      // Box-Muller
      const u = this.next(), v = this.next();
      return Math.sqrt(-2 * Math.log(u + 1e-9)) * Math.cos(2 * Math.PI * v);
    }
  };
}

function strSeed(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = (h * 0x01000193) >>> 0;
  }
  return h;
}

// ============================================================
// MOCK DATA GENERATOR
// ============================================================
function generateMockData(prompt) {
  const rng = makePRNG(strSeed(prompt));
  const NUM_LAYERS = 36;
  const NUM_TOKENS = 8;
  const HIDDEN_DIM = 4096;

  // Fake token strings derived from prompt words + BPE-style splits
  const words = prompt.trim().split(/\s+/);
  const rawTokens = [];
  words.forEach(w => {
    if (w.length <= 4) {
      rawTokens.push(w);
    } else {
      // Simulate a BPE split at a random boundary
      const cut = Math.max(2, rng.int(2, w.length - 1));
      rawTokens.push(w.slice(0, cut));
      rawTokens.push(w.slice(cut));
    }
  });
  // Trim or pad to NUM_TOKENS
  while (rawTokens.length < NUM_TOKENS) rawTokens.push('[UNK]');
  const tokenStrings = rawTokens.slice(0, NUM_TOKENS);

  // Candidate next tokens (realistic vocabulary)
  const candidates = [
    [" 1889", 0.312], [" the", 0.187], [" 18", 0.143],
    [" Paris", 0.089], [" France", 0.071], [" constructed", 0.052],
    [" 1887", 0.038], [" erected", 0.031], [" designed", 0.027],
    [" completed", 0.019], [" opened", 0.015], [" 1900", 0.011],
    [" a", 0.008], [" by", 0.006], [" during", 0.004]
  ];
  // Normalise probabilities (they sum ~1.013 due to slicing)
  const totalP = candidates.reduce((s, [, p]) => s + p, 0);
  const topLogits = candidates.map(([str, p], i) => [
    1000 + i * 137, p / totalP, str
  ]);

  // Per-token data
  const tokens = tokenStrings.map((tok, ti) => {
    const layers = Array.from({ length: NUM_LAYERS }, (_, li) => {
      // Simulate "interesting" layers with spikes at 12, 24, 35
      const layerHeat = 1.0 +
        (li === 11 ? 1.8 : 0) +
        (li === 23 ? 1.4 : 0) +
        (li === 35 ? 2.0 : 0) +
        rng.float(0, 0.3);

      const tokenHeat = 1.0 + (ti === tokenStrings.length - 1 ? 0.6 : 0) + rng.float(0, 0.2);
      const scale = layerHeat * tokenHeat;

      // Top 12 MLP neurons with activated values
      const mlp_top = Array.from({ length: 12 }, (_, k) => {
        const idx = rng.int(0, HIDDEN_DIM);
        // Mix of high spikes and moderate activations
        const base = k < 3
          ? rng.float(1.5, 3.5) * scale
          : rng.float(0.2, 1.5) * scale;
        return [idx, parseFloat(base.toFixed(4))];
      }).sort((a, b) => b[1] - a[1]);

      // Hot neurons: top 3 of mlp_top
      const hot_neurons = mlp_top.slice(0, 3).map(([idx]) => idx);
      const max_activation = mlp_top[0][1];

      // Attention: concentrated on last few positions (causal mask)
      const numAttnPos = Math.min(ti + 1, 6);
      const attnRaw = Array.from({ length: numAttnPos }, (_, pi) => {
        // Bias toward current and previous token
        const dist = ti - pi;
        return [pi, Math.exp(-dist * rng.float(0.3, 0.8)) * rng.float(0.5, 1.5)];
      });
      const attnSum = attnRaw.reduce((s, [, v]) => s + v, 0) || 1;
      const attn_top = attnRaw
        .map(([pos, v]) => [pos, v / attnSum])
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5);

      // Attention entropy
      const attn_entropy = -attn_top.reduce((s, [, p]) => {
        return s + (p > 0 ? p * Math.log2(p) : 0);
      }, 0);

      // Residual norm grows with depth
      const residual_norm = 2.0 + li * 0.18 + rng.float(-0.2, 0.4);

      return {
        layer_idx: li,
        mlp_top,
        hot_neurons,
        max_activation,
        attn_top,
        attn_entropy: parseFloat(attn_entropy.toFixed(4)),
        residual_norm: parseFloat(residual_norm.toFixed(4))
      };
    });

    return {
      token_id: 1000 + ti * 37,
      token_str: tok,
      position: ti,
      layers,
      top_logits: topLogits
    };
  });

  return {
    model_info: {
      name: "Qwen2.5-1.5B (mock)",
      num_layers: NUM_LAYERS,
      hidden_dim: HIDDEN_DIM,
      num_heads: 16
    },
    prompt,
    tokens
  };
}

// ============================================================
// STATE
// ============================================================
let vizData = null;
let selectedTokenIdx = 0;
let selectedLayerIdx = -1;
let threeScene = null;
let neuronMeshes = [];
let layerPlanes = [];

// ============================================================
// THREE.JS SETUP
// ============================================================
function initThree() {
  const canvas = document.getElementById('three-canvas');
  const wrapper = document.getElementById('canvas-wrapper');

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x0a0a0f, 1);

  const scene = new THREE.Scene();
  threeScene = scene;

  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
  camera.position.set(0, 8, 20);

  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.target.set(0, 0, 0);

  scene.add(new THREE.AmbientLight(0x222244, 1.5));
  const dir = new THREE.DirectionalLight(0x6666ff, 0.8);
  dir.position.set(5, 10, 5);
  scene.add(dir);

  function resize() {
    const w = wrapper.clientWidth, h = wrapper.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(neuronMeshes.map(n => n.mesh));
    if (hits.length > 0) {
      const found = neuronMeshes.find(n => n.mesh === hits[0].object);
      if (found) showNeuronDetail(found);
    }
  });

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(neuronMeshes.map(n => n.mesh));
    const tip = document.getElementById('tooltip');
    if (hits.length > 0) {
      const found = neuronMeshes.find(n => n.mesh === hits[0].object);
      if (found) {
        tip.style.display = 'block';
        tip.style.left = (e.clientX + 12) + 'px';
        tip.style.top = (e.clientY - 20) + 'px';
        tip.innerHTML = `<b>Layer ${found.layerIdx}</b><br>Neuron #${found.neuronIdx}<br>Activation: <span style="color:#8888ff">${found.activation.toFixed(4)}</span>`;
      }
    } else {
      tip.style.display = 'none';
    }
  });

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
}

// ============================================================
// BUILD 3D SCENE
// ============================================================
function buildScene(tokenData) {
  neuronMeshes.forEach(n => threeScene.remove(n.mesh));
  layerPlanes.forEach(p => threeScene.remove(p));
  // Also remove residual lines (they are Line objects added separately)
  const toRemove = [];
  threeScene.traverse(obj => {
    if (obj.isLine || (obj.isMesh && !neuronMeshes.find(n => n.mesh === obj))) {
      toRemove.push(obj);
    }
  });
  toRemove.forEach(obj => threeScene.remove(obj));
  neuronMeshes = [];
  layerPlanes = [];

  if (!tokenData || !tokenData.layers || tokenData.layers.length === 0) return;

  const layers = tokenData.layers;
  const N = layers.length;
  const LAYER_SPACING = 0.55;
  const COLS = 16;
  const DOT_SIZE = 0.08;
  const DOT_SPACING = 0.22;

  function actColor(v, maxV) {
    const t = Math.min(1, v / (maxV + 1e-6));
    const r = Math.min(1, t * 2.5);
    const g = Math.max(0, Math.min(1, t * 2.0 - 0.5));
    const b = Math.max(0, 1.0 - t * 2.0);
    return new THREE.Color(r, g, b);
  }

  const geo = new THREE.SphereGeometry(DOT_SIZE, 6, 6);
  const planeGeo = new THREE.PlaneGeometry(COLS * DOT_SPACING + 0.2, 2.6);
  const planeMat = new THREE.MeshBasicMaterial({
    color: 0x111133, transparent: true, opacity: 0.2, side: THREE.DoubleSide
  });

  const labelsDiv = document.getElementById('layer-labels');
  labelsDiv.innerHTML = '';

  // Use a seeded rng per token for stable fill neurons
  const rng = makePRNG(strSeed(tokenData.token_str + tokenData.position));

  layers.forEach((layer, li) => {
    const y = (li - N / 2) * LAYER_SPACING;

    const plane = new THREE.Mesh(planeGeo, planeMat.clone());
    plane.position.set(0, y, 0);
    plane.rotation.x = -Math.PI / 2;
    threeScene.add(plane);
    layerPlanes.push(plane);

    const neuronMap = new Map();
    layer.hot_neurons.forEach(idx => neuronMap.set(idx, layer.max_activation || 1.0));
    layer.mlp_top.forEach(([idx, v]) => neuronMap.set(idx, v));

    const displayCount = 48;
    const activatedSet = new Set(neuronMap.keys());
    for (let fill = 0; neuronMap.size < displayCount && fill < 2000; fill++) {
      const randIdx = rng.int(0, 10000);
      if (!activatedSet.has(randIdx)) {
        neuronMap.set(randIdx, rng.float(0.01, 0.06));
      }
    }

    const neurons = [...neuronMap.entries()].sort((a, b) => b[1] - a[1]);
    const maxInLayer = neurons[0] ? neurons[0][1] : 1;

    neurons.slice(0, displayCount).forEach(([idx, val], ni) => {
      const col = ni % COLS;
      const row = Math.floor(ni / COLS);
      const x = (col - COLS / 2) * DOT_SPACING;
      const z = (row - 1) * DOT_SPACING;

      const color = actColor(val, maxInLayer);
      const mat = new THREE.MeshPhongMaterial({ color, emissive: color, emissiveIntensity: 0.4 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);

      const scale = 0.5 + (val / (maxInLayer + 1e-6)) * 1.5;
      mesh.scale.setScalar(scale);

      threeScene.add(mesh);
      neuronMeshes.push({ mesh, layerIdx: layer.layer_idx, neuronIdx: idx, activation: val });
    });

    if (li > 0) {
      const prevY = ((li - 1) - N / 2) * LAYER_SPACING;
      const pts = [new THREE.Vector3(0, prevY, 0), new THREE.Vector3(0, y, 0)];
      const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
      const opacity = 0.15 + (layer.residual_norm || 0) / 10;
      const lineMat = new THREE.LineBasicMaterial({
        color: 0x3333aa, transparent: true, opacity: Math.min(0.6, opacity)
      });
      threeScene.add(new THREE.Line(lineGeo, lineMat));
    }

    const lbl = document.createElement('div');
    lbl.className = 'layer-label';
    // Only label every 4th layer to avoid crowding
    lbl.textContent = li % 4 === 0 ? `L${layer.layer_idx}` : '';
    labelsDiv.appendChild(lbl);
  });
}

// ============================================================
// ATTENTION VISUALIZATION
// ============================================================
function renderAttention(layer) {
  const svg = d3.select('#attn-svg');
  svg.selectAll('*').remove();

  if (!layer || !layer.attn_top || layer.attn_top.length === 0) {
    svg.append('text').attr('x', 5).attr('y', 20)
      .attr('fill', '#444466').attr('font-size', 11)
      .text('no attention data');
    return;
  }

  const barH = 16, pad = 4;
  const maxW = 155;
  svg.attr('height', layer.attn_top.length * (barH + pad) + 20);

  const maxWeight = layer.attn_top[0][1] || 1;

  layer.attn_top.forEach(([pos, weight], i) => {
    const g = svg.append('g').attr('transform', `translate(0,${i * (barH + pad) + 4})`);
    const barWidth = (weight / maxWeight) * maxW;

    g.append('rect')
      .attr('width', maxW).attr('height', barH)
      .attr('rx', 2).attr('fill', '#111133').attr('opacity', 0.6);

    g.append('rect')
      .attr('width', barWidth).attr('height', barH)
      .attr('rx', 2).attr('fill', `hsl(${220 + i * 15}, 60%, 50%)`).attr('opacity', 0.8);

    // Token string if we have it
    const tokStr = vizData && vizData.tokens[pos]
      ? escapeHtml(vizData.tokens[pos].token_str)
      : `pos ${pos}`;

    g.append('text').attr('x', Math.max(barWidth + 4, 60)).attr('y', 12)
      .attr('fill', '#6666aa').attr('font-size', 10)
      .text(tokStr.slice(0, 8));

    g.append('text').attr('x', 3).attr('y', 12)
      .attr('fill', '#ffffff').attr('font-size', 10)
      .text((weight * 100).toFixed(1) + '%');
  });

  document.getElementById('attn-info').innerHTML =
    `entropy: <span style="color:#8888ff">${layer.attn_entropy.toFixed(3)}</span>`;
}

// ============================================================
// BOTTOM BAR
// ============================================================
function renderBottom(tokenData, layerIdx) {
  const chipsDiv = document.getElementById('neuron-chips');
  chipsDiv.innerHTML = '';
  document.getElementById('layer-info').textContent =
    layerIdx >= 0 ? `Layer ${layerIdx}` : 'hover a layer';

  let layer = null;
  if (tokenData && layerIdx >= 0) {
    layer = tokenData.layers.find(l => l.layer_idx === layerIdx);
  }
  if (!layer && tokenData && tokenData.layers.length > 0) {
    layer = tokenData.layers[tokenData.layers.length - 1];
  }

  if (layer) {
    const top = layer.mlp_top.length > 0 ? layer.mlp_top :
      layer.hot_neurons.map(i => [i, layer.max_activation || 1.0]);
    top.slice(0, 20).forEach(([idx, val]) => {
      const chip = document.createElement('div');
      chip.className = 'neuron-chip';
      chip.innerHTML = `#${idx}<span class="val">${val.toFixed(2)}</span>`;
      chipsDiv.appendChild(chip);
    });
  }

  const logitsDiv = document.getElementById('logit-chips');
  logitsDiv.innerHTML = '';
  if (tokenData && tokenData.top_logits) {
    tokenData.top_logits.slice(0, 15).forEach(([id, prob, str]) => {
      const chip = document.createElement('div');
      chip.className = 'logit-chip';
      const display = (str || `[${id}]`).replace(/\n/g, '\u21b5').replace(/ /g, '\u00b7');
      chip.innerHTML = `"${escapeHtml(display)}"<span class="pct">${(prob * 100).toFixed(1)}%</span>`;
      logitsDiv.appendChild(chip);
    });
  }
}

// ============================================================
// NEURON DETAIL (3D click)
// ============================================================
function showNeuronDetail(neuronObj) {
  selectedLayerIdx = neuronObj.layerIdx;
  const tokenData = vizData && vizData.tokens[selectedTokenIdx];
  const layer = tokenData && tokenData.layers.find(l => l.layer_idx === neuronObj.layerIdx);
  if (layer) {
    renderAttention(layer);
    renderBottom(tokenData, neuronObj.layerIdx);
  }
}

// ============================================================
// TOKEN SELECTION
// ============================================================
function selectToken(idx) {
  selectedTokenIdx = idx;
  document.querySelectorAll('.token-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });

  if (!vizData) return;
  const tokenData = vizData.tokens[idx];
  if (!tokenData) return;

  buildScene(tokenData);

  const layer = tokenData.layers[tokenData.layers.length - 1];
  renderAttention(layer);
  renderBottom(tokenData, layer ? layer.layer_idx : -1);
}

// ============================================================
// MAIN: generate mock and render
// ============================================================
function runMock() {
  const prompt = document.getElementById('prompt-input').value.trim() || 'The Eiffel Tower was built in';
  const status = document.getElementById('status');
  status.textContent = 'generating mock data…';

  // Slight delay so status flickers
  setTimeout(() => {
    vizData = generateMockData(prompt);
    status.textContent = `${vizData.tokens.length} tokens · ${vizData.model_info.num_layers}L · MOCK`;

    const listDiv = document.getElementById('token-list');
    listDiv.innerHTML = '<div style="font-size:9px;color:#333355;padding:4px 8px;letter-spacing:1px;">TOKENS</div>';

    vizData.tokens.forEach((tok, i) => {
      const el = document.createElement('div');
      el.className = 'token-item';
      el.innerHTML = `<div class="token-pos">pos ${tok.position}</div><div>${escapeHtml(tok.token_str || `[${tok.token_id}]`)}</div>`;
      el.addEventListener('click', () => selectToken(i));
      listDiv.appendChild(el);
    });

    selectToken(0);
  }, 80);
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

document.addEventListener('DOMContentLoaded', () => {
  initThree();
  document.getElementById('run-btn').addEventListener('click', runMock);
  document.getElementById('prompt-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') runMock();
  });
  // Auto-run on load
  runMock();
});
</script>
