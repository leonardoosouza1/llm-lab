<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IARA Observatory</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #050510;
      color: #e0e8ff;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    #root {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 18px;
      border-bottom: 1px solid #1a2040;
      background: rgba(5,5,20,0.97);
      flex-shrink: 0;
      height: 46px;
    }
    .hdr-title { font-size: 1rem; font-weight: bold; color: #7eb8ff; letter-spacing: 2px; }
    .hdr-title span { color: #ff7eb8; }
    .mode-tabs { display: flex; gap: 6px; }
    .tab {
      padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 0.68rem;
      border: 1px solid #2a3060; background: transparent; color: #8898cc;
      transition: all 0.2s; font-family: inherit; letter-spacing: 1px; text-transform: uppercase;
    }
    .tab:hover { border-color: #4a60c0; color: #b0c0ff; }
    .tab.active { background: #1a2880; border-color: #5070e0; color: #c0d0ff; }

    /* ── Canvas wrap — fills ALL remaining height ── */
    .canvas-wrap {
      position: relative;
      flex: 1 1 0;        /* take remaining space */
      min-height: 0;      /* critical: lets flex child shrink below content size */
      overflow: hidden;
    }

    /* Canvas fills its parent absolutely */
    .canvas-wrap canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Overlay panels ── */
    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .formula-box {
      position: absolute;
      top: 14px; left: 14px;
      background: rgba(5,10,30,0.88);
      border: 1px solid #1e2d60;
      border-radius: 6px;
      padding: 11px 15px;
      max-width: 320px;
      font-size: 0.69rem;
      line-height: 1.75;
    }
    .formula-box h3 { color: #7eb8ff; margin-bottom: 7px; font-size: 0.77rem; letter-spacing: 1px; }
    .formula-box code { color: #ffd07e; font-size: 0.67rem; }
    .formula-box p { color: #7888aa; margin-top: 5px; }

    .metrics-col {
      position: absolute;
      top: 14px; right: 14px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-width: 190px;
    }
    .metric-card {
      background: rgba(5,10,30,0.88);
      border: 1px solid #1e2d60;
      border-radius: 6px;
      padding: 7px 11px;
    }
    .metric-label { font-size: 0.6rem; color: #5060a0; text-transform: uppercase; letter-spacing: 1px; }
    .metric-value { font-size: 1.05rem; color: #7eb8ff; font-weight: bold; }
    .metric-bar-bg { height: 3px; background: #1a2040; border-radius: 2px; margin-top: 4px; }
    .metric-bar-fill { height: 100%; border-radius: 2px; transition: width 0.35s; }

    .cycle-hud {
      position: absolute;
      bottom: 14px; right: 14px;
      font-size: 0.62rem;
      color: #3a4a70;
    }
    .cycle-bar-bg { height: 2px; background: #1a2040; border-radius: 1px; margin-top: 4px; overflow: hidden; }
    .cycle-bar-fill { height: 100%; background: #3a6aff; transition: width 0.5s linear; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const MODES = ['GRAVITY', 'VORTEX', 'KAN BARRIER', 'RESONANCE'];
const CYCLE_MS = 20000;

// ── Physics helpers ───────────────────────────────────────────────────────────
function doubleWell(x) { return x - x * x * x; }
function vortexCurl(x, y, t) {
  const r = Math.sqrt(x * x + y * y) + 0.001;
  const theta = Math.atan2(y, x) + t * 0.35;
  return [-Math.sin(theta) / r, Math.cos(theta) / r];
}

// ── Hook: Three.js — uses ResizeObserver on the parent div ───────────────────
function useThreeScene(wrapRef) {
  const canvasRef    = useRef(null);
  const sceneRef     = useRef(null);
  const cameraRef    = useRef(null);
  const rendererRef  = useRef(null);

  useEffect(() => {
    const wrap = wrapRef.current;
    if (!wrap) return;

    // Create canvas and append to wrapper
    const canvas = document.createElement('canvas');
    wrap.appendChild(canvas);
    canvasRef.current = canvas;

    const w = wrap.clientWidth  || window.innerWidth;
    const h = wrap.clientHeight || (window.innerHeight - 46);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(w, h);
    renderer.setClearColor(0x050510, 1);

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, w / h, 0.1, 2000);
    camera.position.set(0, 0, 80);

    scene.add(new THREE.AmbientLight(0x223366, 2));
    const pt = new THREE.PointLight(0x4488ff, 3, 300);
    pt.position.set(0, 50, 50);
    scene.add(pt);

    sceneRef.current   = scene;
    cameraRef.current  = camera;
    rendererRef.current = renderer;

    // ResizeObserver — more reliable than window resize inside an iframe
    const ro = new ResizeObserver(entries => {
      for (const entry of entries) {
        const { width, height } = entry.contentRect;
        if (width && height) {
          renderer.setSize(width, height);
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
        }
      }
    });
    ro.observe(wrap);

    // Orbital drag
    let isDragging = false, lastX = 0, lastY = 0;
    let theta = 0, phi = Math.PI / 2, radius = 80;
    const updateCam = () => {
      camera.position.set(
        radius * Math.sin(phi) * Math.sin(theta),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.cos(theta)
      );
      camera.lookAt(0, 0, 0);
    };
    canvas.addEventListener('mousedown', e => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
    window.addEventListener('mouseup',   () => { isDragging = false; });
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      theta -= (e.clientX - lastX) * 0.008;
      phi    = Math.max(0.1, Math.min(Math.PI - 0.1, phi - (e.clientY - lastY) * 0.008));
      lastX = e.clientX; lastY = e.clientY;
      updateCam();
    });
    canvas.addEventListener('wheel', e => {
      radius = Math.max(20, Math.min(200, radius + e.deltaY * 0.08));
      updateCam();
    }, { passive: true });

    return () => {
      ro.disconnect();
      renderer.dispose();
      if (canvas.parentNode) canvas.parentNode.removeChild(canvas);
    };
  }, []);

  return { canvasRef, sceneRef, cameraRef, rendererRef };
}

// ── N-body gravity ────────────────────────────────────────────────────────────
function useGravityBodies(N = 26) {
  const bodiesRef = useRef([]);
  useEffect(() => {
    bodiesRef.current = Array.from({ length: N }, (_, i) => {
      const a = (i / N) * Math.PI * 2;
      const r = 10 + Math.random() * 25;
      return {
        x: r * Math.cos(a), y: r * Math.sin(a), z: (Math.random() - 0.5) * 10,
        vx: -Math.sin(a) * 2, vy: Math.cos(a) * 2, vz: 0,
        mass: 0.5 + Math.random() * 3,
      };
    });
  }, [N]);

  const step = useCallback((dt = 0.016) => {
    const G = 80, eps = 4;
    const b = bodiesRef.current;
    for (let i = 0; i < b.length; i++) {
      let fx = 0, fy = 0, fz = 0;
      for (let j = 0; j < b.length; j++) {
        if (i === j) continue;
        const dx = b[j].x - b[i].x, dy = b[j].y - b[i].y, dz = b[j].z - b[i].z;
        const r2 = dx*dx + dy*dy + dz*dz + eps;
        const f  = G * b[j].mass / (r2 * Math.sqrt(r2));
        fx += f * dx; fy += f * dy; fz += f * dz;
      }
      b[i].vx += fx * dt; b[i].vy += fy * dt; b[i].vz += fz * dt;
    }
    for (const bd of b) {
      bd.x += bd.vx * dt; bd.y += bd.vy * dt; bd.z += bd.vz * dt;
      const r = Math.sqrt(bd.x**2 + bd.y**2 + bd.z**2);
      if (r > 50) { bd.vx *= 0.96; bd.vy *= 0.96; bd.vz *= 0.96; }
    }
    return b;
  }, []);

  return { bodiesRef, step };
}

// ── Kuramoto ──────────────────────────────────────────────────────────────────
function useKuramoto(N = 36) {
  const stateRef = useRef({ phases: [], freqs: [] });
  useEffect(() => {
    stateRef.current.phases = Array.from({ length: N }, () => Math.random() * Math.PI * 2);
    stateRef.current.freqs  = Array.from({ length: N }, () => (Math.random() - 0.5) * 2);
  }, [N]);

  const step = useCallback((K = 2.5, dt = 0.05) => {
    const { phases, freqs } = stateRef.current;
    const n = phases.length;
    const dphis = phases.map((phi, i) => {
      let c = 0;
      for (let j = 0; j < n; j++) c += Math.sin(phases[j] - phi);
      return freqs[i] + (K / n) * c;
    });
    for (let i = 0; i < n; i++) phases[i] += dphis[i] * dt;
    let re = 0, im = 0;
    for (const p of phases) { re += Math.cos(p); im += Math.sin(p); }
    return { phases, coherence: Math.sqrt(re*re + im*im) / n };
  }, []);

  return { stateRef, step };
}

// ── Scene builders ────────────────────────────────────────────────────────────
function clearScene(scene) {
  // keep lights (index 0,1)
  while (scene.children.length > 2) scene.remove(scene.children[2]);
}

function buildGravityScene(scene, bodies) {
  clearScene(scene);
  for (const b of bodies) {
    const r   = 0.5 + b.mass * 0.4;
    const geo = new THREE.SphereGeometry(r, 10, 7);
    const hue = (b.mass / 4) * 0.6;
    const mat = new THREE.MeshPhongMaterial({
      color:    new THREE.Color().setHSL(hue, 0.9, 0.6),
      emissive: new THREE.Color().setHSL(hue, 0.8, 0.12),
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(b.x, b.y, b.z);
    scene.add(mesh);
  }
  // gravity links
  const pts = [];
  for (let i = 0; i < bodies.length; i++) {
    for (let j = i + 1; j < bodies.length; j++) {
      const dx = bodies[j].x - bodies[i].x, dy = bodies[j].y - bodies[i].y, dz = bodies[j].z - bodies[i].z;
      if (Math.sqrt(dx*dx+dy*dy+dz*dz) < 28) {
        pts.push(bodies[i].x, bodies[i].y, bodies[i].z, bodies[j].x, bodies[j].y, bodies[j].z);
      }
    }
  }
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  scene.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: 0x1a3080, opacity: 0.4, transparent: true })));
}

function buildVortexScene(scene, t) {
  clearScene(scene);
  const N = 36, spread = 28;
  const step = (spread / N) * 2;
  for (let i = -N/2; i < N/2; i++) {
    for (let j = -N/2; j < N/2; j++) {
      const x = i * step, y = j * step;
      const [vx, vy] = vortexCurl(x, y, t);
      const speed = Math.sqrt(vx*vx + vy*vy);
      const geo  = new THREE.ConeGeometry(0.14, 0.7 + speed * 0.5, 4);
      const hue  = 0.6 + speed * 0.12;
      const mat  = new THREE.MeshPhongMaterial({
        color:    new THREE.Color().setHSL(hue, 0.9, 0.5 + speed * 0.12),
        emissive: new THREE.Color().setHSL(hue, 0.7, 0.07),
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, 0);
      mesh.lookAt(x + vx, y + vy, 0.001);
      mesh.rotateX(Math.PI / 2);
      scene.add(mesh);
    }
  }
}

let _kanBuilt = false;
function buildKANScene(scene) {
  if (_kanBuilt) return;
  _kanBuilt = true;
  clearScene(scene);
  const W = 52, H = 52, segs = 64;
  const geo = new THREE.PlaneGeometry(W, H, segs, segs);
  const pos = geo.attributes.position.array;
  for (let i = 0; i < pos.length; i += 3) {
    const x = pos[i];
    let v = 0, X = x / 6, dt = 0.04;
    for (let s = 0; s < 50; s++) { v += doubleWell(Math.max(-2.4, Math.min(2.4, X))) * dt; X = Math.max(-2.4, Math.min(2.4, X + v * dt)); }
    pos[i + 2] = X * 7;
  }
  geo.computeVertexNormals();
  const mat  = new THREE.MeshPhongMaterial({ color: 0x1a44cc, emissive: 0x09102a, side: THREE.DoubleSide, shininess: 80 });
  const wmat = new THREE.MeshBasicMaterial({ color: 0x4488ff, wireframe: true, opacity: 0.2, transparent: true });
  scene.add(new THREE.Mesh(geo, mat));
  const geo2 = new THREE.PlaneGeometry(W, H, segs, segs);
  // copy z values
  geo2.attributes.position.array.set(geo.attributes.position.array);
  geo2.attributes.position.needsUpdate = true;
  scene.add(new THREE.Mesh(geo2, wmat));
}

function buildResonanceScene(scene, phases) {
  clearScene(scene);
  const N = phases.length, R = 22;
  for (let i = 0; i < N; i++) {
    const angle = (i / N) * Math.PI * 2;
    const hue   = (phases[i] % (Math.PI * 2)) / (Math.PI * 2);
    const geo   = new THREE.SphereGeometry(0.55, 10, 8);
    const mat   = new THREE.MeshPhongMaterial({
      color:    new THREE.Color().setHSL(hue, 0.9, 0.6),
      emissive: new THREE.Color().setHSL(hue, 0.8, 0.14),
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(R * Math.cos(angle), Math.sin(phases[i]) * 4, R * Math.sin(angle));
    scene.add(mesh);
  }
  const pts = [];
  for (let i = 0; i < N; i++) {
    const a0 = (i / N) * Math.PI * 2, a1 = ((i+1) / N) * Math.PI * 2;
    pts.push(R*Math.cos(a0), Math.sin(phases[i])*4, R*Math.sin(a0),
             R*Math.cos(a1), Math.sin(phases[(i+1)%N])*4, R*Math.sin(a1));
  }
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  scene.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: 0x3366ff, opacity: 0.55, transparent: true })));
}

// ── Formulas ──────────────────────────────────────────────────────────────────
const FORMULAS = {
  GRAVITY: {
    title: 'Semantic Gravity',
    lines: [
      { label: 'Mass', code: 'm_i = ||embed_i||₂' },
      { label: 'Force', code: 'F_ij = G·m_i·m_j / d²_ij' },
      { label: 'Attn', code: 'A = softmax(F) replaces QKᵀ/√d' },
      { text: 'Razão max/min de massa: 203× no Qwen3-8B.' },
    ],
  },
  VORTEX: {
    title: 'Vortex Field',
    lines: [
      { label: 'Skew', code: 'A_vortex = A + λ·(A − Aᵀ)/2' },
      { label: 'Curl', code: '∇ × A ≠ 0 → relações orbitais' },
      { label: 'λ', code: 'λ ∈ [0, 1],  λ=0 = atenção padrão' },
      { text: 'A→B ≠ B→A. Fluxo direcional entre tokens.' },
    ],
  },
  'KAN BARRIER': {
    title: 'KAN Double-Well',
    lines: [
      { label: 'V(x)', code: '-x²/2 + x⁴/4' },
      { label: 'F(x)', code: 'x − x³  (mínimos em ±1)' },
      { label: 'Gate', code: 'sinal forte → atravessa barreira' },
      { text: 'Ruído fica preso no poço. Substitui SiLU.' },
    ],
  },
  RESONANCE: {
    title: 'Kuramoto Decoder',
    lines: [
      { label: 'ODE', code: 'dφᵢ/dt = ωᵢ + K/N·Σ sin(φⱼ−φᵢ)' },
      { label: 'Learn', code: 'Δω = η·sin(φ_true − φᵢ)' },
      { label: 'Custo', code: 'O(k) vs O(vocab) — ~30× menor' },
      { text: 'Online learning sem backprop.' },
    ],
  },
};

// ── Components ────────────────────────────────────────────────────────────────
function FormulaPanel({ mode }) {
  const f = FORMULAS[mode];
  if (!f) return null;
  return (
    <div className="formula-box">
      <h3>{f.title}</h3>
      {f.lines.map((l, i) => (
        <div key={i}>
          {l.code && <><span style={{color:'#5060a0'}}>{l.label}: </span><code>{l.code}</code><br /></>}
          {l.text && <p>{l.text}</p>}
        </div>
      ))}
    </div>
  );
}

function MetricBar({ label, value, max = 1, color = '#3a6aff' }) {
  const pct = Math.min(100, (Math.abs(value) / (max || 1)) * 100);
  const disp = typeof value === 'number' ? value.toFixed(3) : value;
  return (
    <div className="metric-card">
      <div className="metric-label">{label}</div>
      <div className="metric-value">{disp}</div>
      <div className="metric-bar-bg">
        <div className="metric-bar-fill" style={{ width: pct + '%', background: color }} />
      </div>
    </div>
  );
}

// ── Metric config per mode ────────────────────────────────────────────────────
const METRIC_CFG = {
  GRAVITY:      [['Mean KE',  150, '#ff7e40'], ['Max Mass', 4, '#7eb8ff'], ['Min Mass', 4, '#40ff90']],
  VORTEX:       [['Curl λ',   1,   '#b07eff'], ['Vortex ω', 1, '#ff7eb8'], ['Coherence',1, '#7eb8ff']],
  'KAN BARRIER':[['Dead %',   1,   '#ffd07e'], ['Barrier',  1, '#ff7e40'], ['SNR',      2, '#40ff90']],
  RESONANCE:    [['Coherence',1,   '#7eb8ff'], ['Mean ω',   2, '#ff7e40'], ['N Osc',   40, '#40ffb0']],
};

// ── Main ──────────────────────────────────────────────────────────────────────
function Observatory() {
  const wrapRef = useRef(null);
  const { sceneRef, cameraRef, rendererRef } = useThreeScene(wrapRef);
  const { bodiesRef, step: gravStep } = useGravityBodies(26);
  const { stateRef: kurState, step: kurStep } = useKuramoto(36);

  const animRef    = useRef(null);
  const clockRef   = useRef(0);
  const modeRef    = useRef('GRAVITY');  // stable ref for animation loop
  const kanBuilt   = useRef(false);

  const [mode, setModeState] = useState('GRAVITY');
  const [metrics, setMetrics] = useState({ a: 0, b: 0, c: 0 });
  const [progress, setProgress] = useState(0);

  const setMode = useCallback(m => {
    modeRef.current = m;
    kanBuilt.current = (m !== 'KAN BARRIER') ? false : kanBuilt.current;
    setModeState(m);
  }, []);

  // Auto-cycle
  useEffect(() => {
    const start = Date.now();
    const id = setInterval(() => {
      const elapsed = (Date.now() - start) % CYCLE_MS;
      setProgress(elapsed / CYCLE_MS);
      if (elapsed < 500) {
        setMode(m => MODES[(MODES.indexOf(m) + 1) % MODES.length]);
      }
    }, 500);
    return () => clearInterval(id);
  }, [setMode]);

  // Animation loop
  useEffect(() => {
    let prev = performance.now();
    const tick = () => {
      animRef.current = requestAnimationFrame(tick);
      const now = performance.now();
      const dt  = Math.min((now - prev) / 1000, 0.05);
      prev = now;
      clockRef.current += dt;
      const t = clockRef.current;

      const scene    = sceneRef.current;
      const renderer = rendererRef.current;
      const camera   = cameraRef.current;
      if (!scene || !renderer || !camera) return;

      const m = modeRef.current;

      if (m === 'GRAVITY') {
        const bodies = gravStep(dt);
        buildGravityScene(scene, bodies);
        const ke = bodies.reduce((s, b) => s + 0.5 * b.mass * (b.vx**2 + b.vy**2 + b.vz**2), 0);
        const masses = bodies.map(b => b.mass);
        setMetrics({ a: ke / bodies.length, b: Math.max(...masses), c: Math.min(...masses) });
      } else if (m === 'VORTEX') {
        buildVortexScene(scene, t);
        setMetrics({ a: 0.3 + 0.3 * Math.sin(t * 0.4), b: 0.7 + 0.2 * Math.cos(t*0.5), c: 0.866 });
      } else if (m === 'KAN BARRIER') {
        if (!kanBuilt.current) {
          kanBuilt.current = true;
          _kanBuilt = false;          // allow rebuild on mode entry
          buildKANScene(scene);
          if (scene.children[2]) scene.children[2].rotation.z = 0;
        }
        if (scene.children[2]) scene.children[2].rotation.z = t * 0.08;
        setMetrics({ a: 0.354 + 0.05 * Math.sin(t), b: 1.0, c: 1.5 + 0.3 * Math.sin(t * 0.7) });
      } else if (m === 'RESONANCE') {
        const K = 2.5 + Math.sin(t * 0.2) * 1.5;
        const { phases, coherence } = kurStep(K, 0.05);
        buildResonanceScene(scene, phases);
        setMetrics({ a: coherence, b: 0.5, c: phases.length });
      }

      renderer.render(scene, camera);
    };
    animRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(animRef.current);
  }, [gravStep, kurStep]);

  const mcfg = METRIC_CFG[mode] || [];

  return (
    <>
      <div className="hdr">
        <div className="hdr-title">IARA <span>OBSERVATORY</span></div>
        <div className="mode-tabs">
          {MODES.map(m => (
            <button key={m} className={`tab${mode === m ? ' active' : ''}`}
              onClick={() => setMode(m)}>
              {m}
            </button>
          ))}
        </div>
      </div>

      {/* Canvas wrapper — flex: 1, fills all remaining height */}
      <div className="canvas-wrap" ref={wrapRef}>
        {/* canvas injected by useThreeScene */}
        <div className="overlay">
          <FormulaPanel mode={mode} />
          <div className="metrics-col">
            <MetricBar label={mcfg[0]?.[0] ?? 'A'} value={metrics.a} max={mcfg[0]?.[1] ?? 1} color={mcfg[0]?.[2] ?? '#3a6aff'} />
            <MetricBar label={mcfg[1]?.[0] ?? 'B'} value={metrics.b} max={mcfg[1]?.[1] ?? 1} color={mcfg[1]?.[2] ?? '#ff6a3a'} />
            <MetricBar label={mcfg[2]?.[0] ?? 'C'} value={metrics.c} max={mcfg[2]?.[1] ?? 1} color={mcfg[2]?.[2] ?? '#3affa0'} />
          </div>
          <div className="cycle-hud">
            AUTO-CYCLE
            <div className="cycle-bar-bg">
              <div className="cycle-bar-fill" style={{ width: (progress * 100) + '%' }} />
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Observatory />);
</script>
</body>
</html>
