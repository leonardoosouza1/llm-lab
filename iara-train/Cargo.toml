[package]
name = "iara-train"
version = "0.2.0"
edition = "2021"
description = "IARA Training Engine — Native HIP LoRA fine-tuning"

[dependencies]
compute-core = { path = "../compute-core" }
hip-ffi = { path = "../hip-ffi" }
rocm-backend = { path = "../rocm-backend" }
iara-observe = { path = "../iara-observe" }
llama-sys = { path = "../llama-sys" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
half = { version = "2", features = ["num-traits"] }
memmap2 = "0.9"
rand = "0.8"

[features]
default = ["rocm"]
rocm = []
