[package]
name = "iara-byte-bench"
version = "0.1.0"
edition = "2021"
description = "Benchmark de accuracy aritmética: Qwen 1.5B (via iara-engine HTTP API) vs byte-language-lab"

[[bin]]
name = "byte-bench"
path = "src/main.rs"

[[bin]]
name = "dump_qwen_traces"
path = "src/bin/dump_qwen_traces.rs"

[dependencies]
# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Byte-language-lab (path dep, sem cópia de código)
blab = { package = "byte-language-lab", path = "../../byte-language-lab" }

# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1"
